name: Monorepo CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  python-test-and-lint:
    name: Python Services & Contracts Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/api/requirements.txt
          pip install -r services/pack-builder/requirements.txt
          pip install flake8

      - name: Lint Python Code
        run: |
          flake8 services/ packages/ --count --max-line-length=127 --statistics --exclude=alembic,build,.venv

      - name: Run Pack Schema Smoke Tests
        env:
          PYTHONPATH: packages/contracts/python:packages:.
        run: |
          python -m pytest packages/language_pack_schema/test_pack_schema.py

      - name: Run Pack Builder Tests
        env:
          PYTHONPATH: services/pack-builder:packages/contracts/python:.
        run: |
          python -m pytest services/pack-builder/tests

      - name: Run Backend Control Plane Tests
        env:
          PYTHONPATH: services/api:packages/contracts/python:.
        run: |
          python -m pytest services/api/tests

  android-test:
    name: Android App Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x apps/android/gradlew

      - name: Run Android Unit Tests
        working-directory: apps/android
        run: ./gradlew test
